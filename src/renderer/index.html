<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synology Sync Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <span class="icon">☁️</span>
        <h1>Synology Sync Manager</h1>
      </div>
      <div class="header-right">
        <button type="button" class="btn btn-secondary btn-sm" id="btnOpenNasModal">⚙️ 시놀로지 NAS 연결 설정</button>
        <div class="status-badge" id="globalStatusBadge">대기 중</div>
      </div>
    </header>

    <main class="content-grid">
      <!-- 1. Folder Mapping Card (Multi-Folder Support) -->
      <section class="card">
        <div class="card-header folders-card-header">
          <h2>📁 1. 동기화 폴더 설정 (다중 폴더 지원)</h2>
          <button type="button" class="btn btn-secondary btn-sm" id="btnAddFolder">➕ 새 폴더 추가</button>
        </div>
        <div class="card-body">
          <div id="foldersContainer" class="folders-container"></div>
          <div id="noFoldersNotice" class="no-folders-notice" style="display: none;">
            등록된 동기화 폴더가 없습니다. <strong>[➕ 새 폴더 추가]</strong>를 클릭해 폴더를 등록해 주세요.
          </div>
        </div>
      </section>

      <!-- 2. Schedule & Actions Card -->
      <section class="card">
        <div class="card-header">
          <h2>⏱️ 2. 주기 및 동기화 제어</h2>
        </div>
        <div class="card-body">
          <div class="schedule-controls">
            <div class="form-group">
              <label for="syncInterval">자동 동기화 주기</label>
              <select id="syncInterval">
                <option value="0">수동 실행만</option>
                <option value="15">15분마다</option>
                <option value="30" selected>30분마다 (기본)</option>
                <option value="60">1시간마다</option>
                <option value="360">6시간마다</option>
                <option value="1440">매일 1회</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary" id="btnSaveConfig">설정 저장</button>
          </div>

          <div class="form-group checkbox-group realtime-box">
            <label>
              <input type="checkbox" id="realtimeSync" />
              ⚡ <strong>실시간 파일 변경 감지 및 자동 동기화 활성화</strong> (로컬 파일 변경 시 즉시 동기화)
            </label>
          </div>

          <div class="form-group checkbox-group autostart-box">
            <label>
              <input type="checkbox" id="autoStart" />
              🚀 <strong>Windows 시작 시 자동 실행</strong> (시작 프로그램 등록)
            </label>
          </div>

          <div class="sync-actions-box">
            <div class="sync-buttons-group">
              <button type="button" class="btn btn-success btn-large" id="btnStartSync">
                ▶ 지금 즉시 동기화 실행
              </button>
              <button type="button" class="btn btn-danger btn-large" id="btnCancelSync" style="display: none;">
                ⏹️ 동기화 취소
              </button>
            </div>
            
            <div class="progress-section" id="progressSection">
              <div class="progress-info">
                <span id="progressCurrentFile">대기 상태</span>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. Real-time Activity Logs Card -->
      <section class="card full-width-card">
        <div class="card-header logs-header">
          <h2>📜 3. 활동 로그</h2>
          <div class="logs-header-actions">
            <button type="button" class="btn-text" id="btnOpenLogsFolder">📂 로그 폴더 열기</button>
            <button type="button" class="btn-text" id="btnClearLogs">로그 지우기</button>
          </div>
        </div>
        <div class="card-body">
          <div class="log-console" id="logConsole">
            <div class="log-entry system">[시스템] Synology Sync Manager가 준비되었습니다.</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Synology NAS Connection Modal -->
    <div class="modal-overlay" id="nasModalOverlay" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2>🌐 시놀로지 NAS 연결 설정</h2>
          <button type="button" class="modal-close-btn" id="btnCloseNasModal" aria-label="닫기">&times;</button>
        </div>
        <div class="modal-body form-group-grid">
          <div class="form-group full-width">
            <label for="nasUrl">WebDAV 서버 주소 (HTTPS 권장)</label>
            <input type="text" id="nasUrl" placeholder="https://my-nas.synology.me:5006" />
          </div>
          <div class="form-group">
            <label for="nasUsername">아이디</label>
            <input type="text" id="nasUsername" placeholder="username" />
          </div>
          <div class="form-group">
            <label for="nasPassword">비밀번호</label>
            <input type="password" id="nasPassword" placeholder="••••••••" />
          </div>
          <div class="form-group full-width checkbox-group">
            <label>
              <input type="checkbox" id="allowInsecureSSL" checked />
              자체 서명(사설) SSL 인증서 허용 (SSL 검증 오류 방지)
            </label>
          </div>
          <div class="card-actions full-width" style="margin-top: 4px;">
            <button type="button" class="btn btn-secondary" id="btnTestConnection">연결 테스트</button>
            <span class="test-result" id="testResultMsg"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelNasModal">취소</button>
          <button type="button" class="btn btn-primary" id="btnSaveNasModal">저장 및 적용</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
